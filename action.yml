name: goquality check
description: Fail when a change makes a Go project worse (new findings or lower coverage).
author: iv-one
branding:
  icon: check-circle
  color: blue

inputs:
  command:
    description: goquality command to run, "check", "" for the plain report, or "publish" to commit badges and the report to the quality-history branch on pushes to the default branch
    default: check
  args:
    description: Extra arguments, e.g. "--cover" or "--baseline origin/release" (for publish, they are passed to goquality collect)
    default: ""
  working-directory:
    description: Directory to run goquality in
    default: .

runs:
  using: composite
  steps:
    # Build from the action's own checkout, so @v0 of the action runs v0 of
    # the tool, compiled with the project's Go toolchain (set up by
    # actions/setup-go before this step).
    - name: Install goquality
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GOWORK: "off"
        GOFLAGS: ""
      run: go install ./cmd/goquality

    - name: Run goquality
      if: inputs.command != 'publish'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.command }}
        ARGS: ${{ inputs.args }}
      run: |
        if [ "$COMMAND" = check ] && [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = true ]; then
          echo "::error::goquality check needs the baseline commit: use actions/checkout with fetch-depth: 0"
          exit 2
        fi
        bin=$(go env GOBIN)
        # ARGS is split into words on purpose.
        # shellcheck disable=SC2086
        "${bin:-$(go env GOPATH)/bin}/goquality" $COMMAND $ARGS

    # One analysis renders the badges, report.txt and report.json, so all
    # three agree. Only pushes to the default branch publish, so the step
    # can sit in a workflow that also runs on pull requests.
    - name: Render report
      id: render
      if: inputs.command == 'publish'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARGS: ${{ inputs.args }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [ "$GITHUB_EVENT_NAME" != push ] || [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
          echo "::notice::goquality publish only runs on pushes to the default branch; skipped"
          exit 0
        fi
        bin=$(go env GOBIN)
        goquality="${bin:-$(go env GOPATH)/bin}/goquality"
        out="$RUNNER_TEMP/goquality-publish"
        rm -rf "$out" && mkdir -p "$out"
        # ARGS is split into words on purpose.
        # shellcheck disable=SC2086
        "$goquality" collect $ARGS -o "$out/report.json"
        "$goquality" badges --from "$out/report.json" -o "$out/badges"
        {
          echo "goquality report for $GITHUB_REPOSITORY@$GITHUB_SHA ($(date -u +%Y-%m-%d))"
          echo
          "$goquality" --from "$out/report.json" -v --agent=false
        } > "$out/report.txt"
        echo "dir=$out" >> "$GITHUB_OUTPUT"

    # Commits with git plumbing and a temporary index, so the checkout is
    # not touched and a shallow clone is enough. A missing branch is
    # created; other files on it are kept. The push never forces, and a
    # failed push is a warning: publishing must not fail the build.
    - name: Publish to quality-history
      if: inputs.command == 'publish' && steps.render.outputs.dir != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OUT: ${{ steps.render.outputs.dir }}
        BRANCH: quality-history
        GIT_AUTHOR_NAME: github-actions[bot]
        GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: github-actions[bot]
        GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      run: |
        export GIT_INDEX_FILE="$OUT/index"
        parent=
        if git fetch -q --depth=1 origin "refs/heads/$BRANCH" 2>/dev/null; then
          parent=$(git rev-parse FETCH_HEAD)
          git read-tree "$parent"
        else
          echo "::notice::creating the $BRANCH branch"
        fi
        for f in report.json report.txt badges/score.svg badges/grade.svg; do
          git update-index --add --cacheinfo "100644,$(git hash-object -w "$OUT/$f"),$f"
        done
        tree=$(git write-tree)
        if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then
          echo "unchanged"
          exit 0
        fi
        commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "Update badges and report for ${GITHUB_SHA::7}")
        if git push -q origin "$commit:refs/heads/$BRANCH"; then
          echo "Published https://github.com/$GITHUB_REPOSITORY/blob/$BRANCH/report.txt"
        else
          echo "::warning::could not push to $BRANCH; the job needs 'permissions: contents: write', and the branch must accept pushes from GITHUB_TOKEN"
        fi
