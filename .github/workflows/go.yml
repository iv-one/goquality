name: Go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goquality check needs the baseline commit.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # Latest patch of the minimum supported version: go.mod's exact
          # version would pull in stdlib vulnerabilities that govulncheck flags.
          go-version: '1.27.x'
          check-latest: true

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: goquality
        run: go run ./cmd/goquality --verbose --min-score 95

      # Runs this repository's action.yml, as users would with iv-one/goquality@v0.
      - name: goquality check
        uses: ./
        with:
          args: --verbose

  # Publishes README badges, the report and the quality.json snapshot for
  # main to the quality-history branch, using this repository's action as
  # users would.
  badges:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: quality-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true

      # One analysis, with coverage, that the badges, the report and the
      # published snapshot are all rendered from, so they agree.
      - name: Collect snapshot
        uses: ./
        with:
          command: collect
          args: --cover -o ${{ runner.temp }}/quality.json

      # The badges link to the report. The action installed goquality in
      # GOPATH/bin.
      - name: Render badges and report
        run: |
          goquality="$(go env GOPATH)/bin/goquality"
          "$goquality" badges --from "$RUNNER_TEMP/quality.json" -o "$RUNNER_TEMP/badges"
          {
            echo "goquality report for $GITHUB_REPOSITORY@$GITHUB_SHA ($(date -u +%Y-%m-%d))"
            echo
            "$goquality" --from "$RUNNER_TEMP/quality.json" -v --agent=false
          } > "$RUNNER_TEMP/report.txt"

      - uses: actions/checkout@v4
        with:
          ref: quality-history
          path: quality-history

      - name: Commit snapshot, badges and report
        working-directory: quality-history
        run: |
          mkdir -p badges
          cp "$RUNNER_TEMP"/badges/*.svg badges/
          cp "$RUNNER_TEMP/quality.json" "$RUNNER_TEMP/report.txt" .
          git add badges quality.json report.txt
          if git diff --cached --quiet; then
            echo "unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update quality snapshot for ${GITHUB_SHA::7}"
          git push -q
