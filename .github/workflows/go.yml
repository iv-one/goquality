name: Go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goquality check needs the baseline commit.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # Latest patch of the minimum supported version: go.mod's exact
          # version would pull in stdlib vulnerabilities that govulncheck flags.
          go-version: '1.26.x'
          check-latest: true

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: goquality
        run: go run ./cmd/goquality --verbose --min-score 95

      # Runs this repository's action.yml, as users would with iv-one/goquality@v1.
      - name: goquality check
        uses: ./
        with:
          args: --verbose
